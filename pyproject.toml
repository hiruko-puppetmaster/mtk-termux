[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtk-termux"
version = "0.1.0"
description = "MediaTek BROM/DA servicing toolkit for rooted Termux and Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hiruko-puppetmaster" }]
keywords = ["mediatek", "brom", "preloader", "termux", "xflash", "rpmb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Android",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.2.1"]
tui = ["rich>=13.7"]
all = ["pyusb>=1.2.1", "rich>=13.7"]

[project.urls]
Homepage = "https://github.com/hiruko-puppetmaster/mtk-termux"
Repository = "https://github.com/hiruko-puppetmaster/mtk-termux"
Issues = "https://github.com/hiruko-puppetmaster/mtk-termux/issues"

[project.scripts]
mtk-termux = "ui.termux_cli:main"

[tool.setuptools]
packages = ["termux_transport", "core", "parsers", "storage", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
